    <title>Hello css</title>
    <style>
        /* Selector universal: afecta a TODOS los elementos */
        * {
            font-family: monospace;
        }

        /* Selector de etiqueta: afecta a todos los h1 */
        h1 {
            font-size: 50px;
        }

        /* Selector de clase: solo afecta a lo que tenga class="logo" */
        .logo {
            background-color: red;
            color: white;
            padding: 10px;
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>
